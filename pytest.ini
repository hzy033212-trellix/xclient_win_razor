[pytest]
enable_assertion_pass_hook=true
addopts=-s
# pytest's defaults plus install: the git-ignored vendor folder (hxsim, OpenSSL, tools).
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} install
markers =
  smoke: short execution time tests designated for validating each PR made to the XClient repo
  eventor: tests that exercise eventor event buffer audit collection
  ioc: tests that verify IOC alerts delivered to hxsim (tests/test_ioc_alerts)
  audit: audit tests (tests/test_audits)
  memory: Windows memory audit tests (from win_razor, see MEMORY_AUDIT_TESTS.md)
  caseid(id): test case id
  defect: known failure (XClient defect or de-prioritized feature); skipped
  broken: test can't run as written (e.g. needs an 8 GB template); skipped
  compatibility(*platforms): platforms the test is written for (OS_COMPAT)
  compatible: compatibility_test check passes on this host
  incompatible: compatibility_test check fails on this host; still runs
  audit_artifacts(*labels): shared fixture audits copied into the test's results folder

log_cli=True
log_cli_level=INFO
log_cli_format = %(asctime)s - %(levelname)s - %(name)s:%(filename)s:%(lineno)s - %(message)s
log_cli_date_format = %Y-%m-%dT%H:%M:%S.%dZ

log_file = pytest.log
log_file_level=DEBUG
log_file_format = %(asctime)s - %(levelname)s - %(name)s:%(filename)s:%(lineno)s - %(message)s
log_file_date_format = %Y-%m-%dT%H:%M:%S.%dZ
